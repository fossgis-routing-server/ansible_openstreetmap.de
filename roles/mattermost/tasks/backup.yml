---
- name: Deploy Mattermost backup script
  ansible.builtin.template:
      src: templates/do_backup.sh.j2
      dest: "{{ mattermost__install_dir }}/do_backup.sh"
      owner: "root"
      group: "root"
      mode: "0755"

- name: Ensure backup directory exists
  ansible.builtin.file:
      path: "{{ mattermost__backup_dir | default('/data/backup/mattermost') }}"
      state: directory
      owner: "root"
      group: "root"
      mode: "0755"

- name: Deploy systemd service for backups
  ansible.builtin.template:
      src: templates/mattermost-backup.service.j2
      dest: "/etc/systemd/system/mattermost-backup.service"
      owner: "root"
      group: "root"
      mode: "0644"
  register: mattermost_backup_service

- name: Deploy systemd timer for backups
  ansible.builtin.template:
      src: templates/mattermost-backup.timer.j2
      dest: "/etc/systemd/system/mattermost-backup.timer"
      owner: "root"
      group: "root"
      mode: "0644"
  register: mattermost_backup_timer

- name: Enable and start Mattermost backup timer
  ansible.builtin.systemd_service:
      name: mattermost-backup.timer
      state: started
      enabled: true
      daemon_reload: "{{ mattermost_backup_service.changed or mattermost_backup_timer.changed }}"
