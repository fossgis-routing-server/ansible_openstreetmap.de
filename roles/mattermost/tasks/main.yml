# SPDX-License-Identifier: MIT
---
- name: Install Mattermost
  include_tasks: install.yml
  tags: mattermost

- name: Set up nginx site for Mattermost
  nginx_site:
      site: "{{ mattermost__domain }}"
      src: mattermost_nginx.conf.j2
  notify: reload nginx
  tags: mattermost

- name: Setup backup routine
  include_tasks: backup.yml
  tags: mattermost
