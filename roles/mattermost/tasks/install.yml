---
- name: Set up PostgreSQL user for Mattermost
  community.postgresql.postgresql_user:
      name: "{{ mattermost__db_user }}"
      password: "{{ mattermost__db_password }}"
  become_user: postgres

- name: Create PostgreSQL database for Mattermost
  community.postgresql.postgresql_db:
      name: "{{ mattermost__db_name }}"
      owner: "{{ mattermost__db_user }}"
      encoding: "UTF8"
      template: template0
      state: present
  become: true
  become_user: postgres

- name: Create system user for Mattermost
  ansible.builtin.user:
      name: "{{ mattermost__user }}"
      system: true
      create_home: false
      shell: /sbin/nologin

- name: Ensure installation directory exists
  ansible.builtin.file:
      path: "{{ mattermost__install_dir }}"
      state: directory
      owner: "{{ mattermost__user }}"
      group: "{{ mattermost__user }}"
      mode: "0755"

- name: Check currently installed Mattermost version
  ansible.builtin.slurp:
      src: "{{ mattermost__install_dir }}/.installed_version"
  register: mattermost_installed_version_file
  ignore_errors: true

- name: Extract installed version string
  ansible.builtin.set_fact:
      mattermost_current_version: "{{ (mattermost_installed_version_file['content'] | b64decode | trim) if mattermost_installed_version_file['failed'] is not true else 'none' }}"

- name: Rename existing plugins directories before upgrade to preserve them
  ansible.builtin.shell: |
      if [ -d "{{ mattermost__install_dir }}/plugins" ]; then
        mv "{{ mattermost__install_dir }}/plugins" "{{ mattermost__install_dir }}/plugins~"
      fi
      if [ -d "{{ mattermost__install_dir }}/client/plugins" ]; then
        mv "{{ mattermost__install_dir }}/client/plugins" "{{ mattermost__install_dir }}/client/plugins~"
      fi
  when: mattermost_current_version != mattermost__version and mattermost_current_version != 'none'

- name: Download and extract new Mattermost archive to temporary location
  ansible.builtin.unarchive:
      src: "https://releases.mattermost.com/{{ mattermost__version }}/mattermost-team-{{ mattermost__version }}-linux-amd64.tar.gz"
      dest: "/tmp"
      remote_src: true
  when: mattermost_current_version != mattermost__version

- name: Clean old Mattermost binaries before upgrade
  ansible.builtin.file:
      path: "{{ mattermost__install_dir }}/{{ item }}"
      state: absent
  loop:
      - bin
      - webapp
      - channels
      - fonts
      - templates
      - i18n
      - client
  when: mattermost_current_version != mattermost__version

- name: Copy extracted files to installation directory (preserving config, data, logs)
  ansible.builtin.shell: |
      chown -hR {{ mattermost__user }}:{{ mattermost__user }} /tmp/mattermost/
      cp -a /tmp/mattermost/. "{{ mattermost__install_dir }}/"
      rm -rf /tmp/mattermost/
  when: mattermost_current_version != mattermost__version

- name: Restore and merge preserved plugins directories
  ansible.builtin.shell: |
      if [ -d "{{ mattermost__install_dir }}/plugins~" ]; then
        mkdir -p "{{ mattermost__install_dir }}/plugins"
        rsync -au "{{ mattermost__install_dir }}/plugins~/i" "{{ mattermost__install_dir }}/plugins"
        rm -rf "{{ mattermost__install_dir }}/plugins~"
        chown -hR {{ mattermost__user }}:{{ mattermost__user }} "{{ mattermost__install_dir }}/plugins"
      fi
      if [ -d "{{ mattermost__install_dir }}/client/plugins~" ]; then
        mkdir -p "{{ mattermost__install_dir }}/client/plugins"
        rsync -au "{{ mattermost__install_dir }}/client/plugins~/" "{{ mattermost__install_dir }}/client/plugins"
        rm -rf "{{ mattermost__install_dir }}/client/plugins~"
        chown -hR {{ mattermost__user }}:{{ mattermost__user }} "{{ mattermost__install_dir }}/client/plugins"
      fi
  when: mattermost_current_version != mattermost__version and mattermost_current_version != 'none'

- name: Write current version marker file
  ansible.builtin.copy:
      content: "{{ mattermost__version }}\n"
      dest: "{{ mattermost__install_dir }}/.installed_version"
      owner: "{{ mattermost__user }}"
      group: "{{ mattermost__user }}"
      mode: "0644"

- name: Ensure Mattermost config directory exists
  ansible.builtin.file:
      path: "{{ mattermost__install_dir }}/config"
      state: directory
      owner: "{{ mattermost__user }}"
      group: "{{ mattermost__user }}"
      mode: "0750"

- name: Deploy config.json
  ansible.builtin.template:
      src: templates/config.json.j2
      dest: "{{ mattermost__install_dir }}/config/config.json"
      owner: "{{ mattermost__user }}"
      group: "{{ mattermost__user }}"
      mode: "0600"
  register: mattermost_config_file

- name: Deploy Mattermost systemd service unit
  ansible.builtin.template:
      src: templates/mattermost.service.j2
      dest: "/etc/systemd/system/mattermost.service"
      owner: "root"
      group: "root"
      mode: "0644"
  register: mattermost_systemd_service

- name: Manage Mattermost systemd service
  ansible.builtin.systemd_service:
      name: mattermost
      state: started
      enabled: true
      daemon_reload: "{{ mattermost_systemd_service.changed }}"
