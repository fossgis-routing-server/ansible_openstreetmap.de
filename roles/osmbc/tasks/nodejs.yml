---
# Debian Trixie ships Node.js 20, OSMBC needs 22 or newer. NodeSource
# provides one major version per repository; Renovate can't bump this, a
# new major is a deliberate change of osmbc__nodejs_major.
# If another role needs Node.js later, move this file into its own role.

- name: Add NodeSource repository for Node.js {{ osmbc__nodejs_major }}
  ansible.builtin.deb822_repository:
      name: nodesource
      types: deb
      uris: "https://deb.nodesource.com/node_{{ osmbc__nodejs_major }}.x"
      suites: nodistro
      components: main
      signed_by: "https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key"

# Prefer NodeSource over Debian's nodejs package, so an apt upgrade can
# never switch back to Debian's (older) Node.js.
- name: Pin Node.js to the NodeSource repository
  ansible.builtin.copy:
      dest: /etc/apt/preferences.d/nodesource
      content: |
          Package: nodejs
          Pin: origin deb.nodesource.com
          Pin-Priority: 600
      owner: root
      group: root
      mode: "0644"

# One Node.js on the server only
# NodeSource's nodejs package includes npm.
- name: Install Node.js
  ansible.builtin.apt:
      name: nodejs
      state: present
      update_cache: true
  notify: Restart OSMBC
