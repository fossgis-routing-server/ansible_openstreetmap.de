# SPDX-License-Identifier: MIT
---
- name: Install Postfix
  apt:
    name: [postfix]

- name: set /etc/mailname
  copy:
    dest: /etc/mailname
    owner: root
    group: root
    mode: 0644
    content: |
      {{ mail.mailname }}

- name: 'aliases'
  include_tasks: write_and_hash.yml
  vars:
    dest: '/etc/aliases'
    key_char: ':'
    alias: "{{ mail.aliases }}"
    map: mail.aliases

- name: 'sender canonical map'
  include_tasks: write_and_hash.yml
  vars:
    dest: '/etc/postfix/canonical'
    key_char: ''
    alias: "{{ { '@' ~ ansible_facts['fqdn']: '@' ~ mail.mailname } }}"

- name: Check if acme cert matches mailname
  block:
    - name: Locate the certificate referenced by mail.ssl_name
      set_fact:
        _mail_cert: "{{ hostvars[inventory_hostname]|var_merge_lists(suffix='__acme_certificates') | selectattr('name', 'equalto', mail.ssl_name) | list}}"
    - name: Assert the mail certificate is defined and covers mail.mailname
      assert:
        that:
          - _mail_cert | length == 1
          - mail.mailname in (_mail_cert | first).domains
        fail_msg: >-
          mail.ssl_name='{{ mail.ssl_name }}' ({{ _mail_cert | length }} match(es) in
          _acme_certs) does not cover mail.mailname='{{ mail.mailname }}'.
          Domains found: {{ (_mail_cert | first).domains | default([]) }}

- name: Write /etc/postfix/main.cf
  template:
    dest: /etc/postfix/main.cf
    src: main.cf
    owner: root
    group: root
    mode: 0644
  notify:
    - systemctl reload postfix

- name: Write /etc/postfix/master.cf
  copy:
    dest: /etc/postfix/master.cf
    src: master.cf
    owner: root
    group: root
    mode: 0644
  notify:
    - systemctl reload postfix

- name: Install OpenDKIM
  when: mail is defined and mail.opendkim | default(false)
  block:
    - name: Install OpenDKIM from APT
      apt:
        name: [opendkim, opendkim-tools]

    - name: Write /etc/opendkim.conf
      copy:
        src: opendkim.conf
        dest: /etc/opendkim.conf
        owner: root
        group: root
        mode: 0644
      notify:
        - systemctl restart opendkim

    - name: Ensure correct permissions on /etc/opendkim
      file:
        state: directory
        path: /etc/opendkim
        owner: root
        group: root
        mode: 0755

    - name: Ensure correct permissions on /etc/opendkim/keys
      file:
        state: directory
        path: /etc/opendkim/keys
        owner: root
        group: opendkim
        mode: 0750
      notify:
        - systemctl restart opendkim

    - name: Create OpenDKIM key
      shell:
        chdir: /etc/opendkim
        cmd: 'opendkim-genkey --selector={{ mail.opendkim_selector }} --bits=2048 --directory=keys'
        creates: /etc/opendkim/keys/{{ mail.opendkim_selector }}.private
      register: opendkim_key_creation

    - name: Make OpenDKIM key readable for user opendkim
      when: opendkim_key_creation.changed
      file:
        path: '/etc/opendkim/keys/{{ item }}'
        owner: opendkim
        group: root
        mode: 0600
      loop:
        - '{{ mail.opendkim_selector }}.private'
        - '{{ mail.opendkim_selector }}.txt'

    - name: Print public OpenDKIM key
      when: opendkim_key_creation.changed
      block:
        - slurp:
            src: /etc/opendkim/keys/{{ mail.opendkim_selector }}.txt
          register: opendkim_public_key
        - debug:
            msg: 'Please publish the following DNS entry with your public DKIM key:\n{{ opendkim_public_key }}'

    - name: Write /etc/opendkim/keytable
      copy:
        dest: /etc/opendkim/keytable
        owner: root
        group: root
        mode: 0644
        content: |
          default    %:{{ mail.opendkim_selector }}:/etc/opendkim/keys/{{ mail.opendkim_selector }}.private
      notify:
        - systemctl restart opendkim

    - name: Write /etc/opendkim/signingtable
      copy:
        dest: /etc/opendkim/signingtable
        owner: root
        group: root
        mode: 0644
        content: |
          *@{{ mail.mailname}} default
          {% for item in mail.opendkim_domains %}
          *@{{ item }} default
          {% endfor %}
      notify:
        - systemctl restart opendkim

    - name: Create /var/spool/postfix/opendkim
      file:
        path: /var/spool/postfix/opendkim
        owner: opendkim
        group: opendkim
        mode: 0755
        state: directory

    - name: Add Postfix to opendkim group
      user:
        append: yes
        name: postfix
        groups: opendkim

- name: Install sasl auth
  when: mail.relay | default(False)
  block:
    - name: Install saslauth from APT
      apt:
        name: [libsasl2-modules, sasl2-bin]

    - name: Write /etc/postfix/sasl/smtpd.conf
      copy:
        dest: /etc/postfix/sasl/smtpd.conf
        owner: root
        group: root
        mode: 0644
        content: |
          pwcheck_method: saslauthd
          mech_list: plain login
      notify:
        - systemctl restart postfix

    - name: Clear sasldb2
      file:
        path: /etc/sasldb2
        state: absent

    - name: Add users to sasldb2
      command:
        cmd: "saslpasswd2 -c -u {{ mail.mailname }} {{ item.key }}"
        stdin: "{{ item.value }}"
      loop: "{{ mail_users | dict2items }}"

    - name: Ensure saslauthd socket directory exists inside the Postfix chroot
      ansible.builtin.file:
        path: /var/spool/postfix/var/run/saslauthd
        state: directory
        owner: root
        group: sasl
        mode: '0710'

    - name: Add postfix user to the sasl group
      ansible.builtin.user:
        name: postfix
        groups: sasl
        append: true

    - name: Check existing dpkg statoverride for the saslauthd spool directory
      ansible.builtin.command:
        cmd: dpkg-statoverride --list /var/spool/postfix/var/run/saslauthd
      register: saslauthd_statoverride
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Record statoverride and apply it immediately (root:sasl 0710)
      ansible.builtin.command:
        cmd: >-
          dpkg-statoverride --update --add
          root sasl 710 /var/spool/postfix/var/run/saslauthd
      when: >-
        saslauthd_statoverride.stdout | trim
        != 'root sasl 710 /var/spool/postfix/var/run/saslauthd'

    - name: saslauth config for postfix in chroot (OPTIONS="-c -m /var/spool/postfix/var/run/saslauthd")
      ansible.builtin.lineinfile:
        path: /etc/default/saslauthd
        regexp: '^OPTIONS='
        line: 'OPTIONS="-c -m /var/spool/postfix/var/run/saslauthd"'
        state: present
        backup: true
      notify: systemctl restart saslauthd

    - name: saslauth config for using sasldb (MECHANISM="sasldb")
      ansible.builtin.lineinfile:
        path: /etc/default/saslauthd
        regexp: '^MECHANISM='
        line: 'MECHANISM="sasldb"'
        state: present
        backup: true
      notify: systemctl restart saslauthd

    - name: Ensure systemd drop-in directory for saslauthd exists
      ansible.builtin.file:
        path: /etc/systemd/system/saslauthd.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Point saslauthd PIDFile at the socket directory inside the Postfix chroot
      ansible.builtin.copy:
        dest: /etc/systemd/system/saslauthd.service.d/pidfile.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          PIDFile=/var/spool/postfix/var/run/saslauthd/saslauthd.pid
      notify:
        - reload systemd
        - systemctl restart saslauthd


    - name: 'ufw: allow smtp submission'
      ufw:
        comment: 'allow submission'
        rule: allow
        name: "Mail submission"
