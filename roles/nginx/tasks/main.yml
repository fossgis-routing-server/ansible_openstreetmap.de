- name: Check for apache
  fail:
    msg: nginx and apache cannot be run together.
  when: "(webserver__in_use | default('nginx')) != 'nginx'"

- name: Mark nginx the hosts webserver
  set_fact:
    webserver__in_use: nginx

- name: Install nginx
  apt:
    name: nginx
    state: latest

- name: Disable default nginx site
  nginx_site:
    site: default
    state: absent
  when: webserver__default_site | default(False)

- name: Enable status export for munin
  nginx_site:
    site: munin-status-export
    src: nginx_munin_status.jinja
  when: "'munin' in ansible_role_names"
  notify: reload nginx

- name: Configure anonymized IP addresses
  copy:
    src: 'log_anonymized.conf'
    dest: '/etc/nginx/conf.d/log_anonymized.conf'
  notify: restart nginx

- name: Make sure block files exist
  copy:
    content: ''
    dest: '/etc/nginx/{{ item }}'
    mode: 0664
    group: adm
    force: false
  loop:
    - blocked_user_agent.conf
    - blocked_referrer.conf

# NGINX2ROOT: also rewrite sites not regenerated by this play (e.g. munin)
- name: Find nginx site configs for HTTP/2 mitigation
  find:
    paths:
      - /etc/nginx/sites-available
      - /etc/nginx/sites-enabled
      - /etc/nginx/conf.d
    # only regular files; symlinks in sites-enabled are covered via sites-available
    file_type: file
  register: nginx_http2_mitigation_files
  when: not (nginx__http2_enabled | default(false) | bool)

- name: Strip http2 from listen directives (NGINX2ROOT mitigation)
  replace:
    path: "{{ item.path }}"
    regexp: '(\blisten\b[^;]*?)\s+http2\b'
    replace: '\1'
  loop: "{{ nginx_http2_mitigation_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: not (nginx__http2_enabled | default(false) | bool)
  notify: restart nginx

# "http2 on;" only exists on nginx >= 1.25.1, so "http2 off;" is safe as replacement
- name: Switch "http2 on" directives off (NGINX2ROOT mitigation)
  replace:
    path: "{{ item.path }}"
    regexp: '^(\s*)http2\s+on\s*;'
    replace: '\1http2 off;'
  loop: "{{ nginx_http2_mitigation_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: not (nginx__http2_enabled | default(false) | bool)
  notify: restart nginx
