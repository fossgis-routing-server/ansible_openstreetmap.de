---
- name: Deploy Listmonk backup script
  ansible.builtin.template:
      src: templates/listmonk_do_backup.sh.j2
      dest: "{{ listmonk__install_dir | default('/opt/listmonk') }}/do_backup.sh"
      owner: "root"
      group: "root"
      mode: "0755"

- name: Ensure Listmonk backup directory exists
  ansible.builtin.file:
      path: "{{ (listmonk__backup_dir | default('/var/backups')) ~ '/listmonk' }}"
      state: directory
      owner: "postgres"
      group: "postgres"
      mode: "0750"

- name: Deploy systemd service for Listmonk backups
  ansible.builtin.template:
      src: templates/listmonk-backup.service.j2
      dest: "/etc/systemd/system/listmonk-backup.service"
      owner: "root"
      group: "root"
      mode: "0644"
  register: listmonk_backup_service

- name: Deploy systemd timer for Listmonk backups
  ansible.builtin.template:
      src: templates/listmonk-backup.timer.j2
      dest: "/etc/systemd/system/listmonk-backup.timer"
      owner: "root"
      group: "root"
      mode: "0644"
  register: listmonk_backup_timer

- name: Enable and start Listmonk backup timer
  ansible.builtin.systemd_service:
      name: listmonk-backup.timer
      state: started
      enabled: true
      daemon_reload: "{{ listmonk_backup_service.changed or listmonk_backup_timer.changed }}"