stages:
    - maintenance

renovate:
    stage: maintenance
    image: renovate/renovate:latest
    variables:
        RENOVATE_PLATFORM: "gitlab"
        RENOVATE_ENDPOINT: "https://gitlab.fossgis.de/api/v4/"
        RENOVATE_AUTODISCOVER: "false"
        # FIXME: log level debug
        LOG_LEVEL: "debug"
    script:
        - renovate $CI_PROJECT_PATH
    rules:
        # Run automatically on scheduled pipelines (Cron jobs)
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
        # Allow manual triggering from the GitLab Web UI
        - if: '$CI_PIPELINE_SOURCE == "web"'
        # for testing:
        - when: manual
