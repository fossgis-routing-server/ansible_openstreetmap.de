---
weeklyosm:
    hostname: "weeklyosm.eu"
    hostname_aliases:
        - "www.weeklyosm.eu"
        - "aitov.openstreetmap.de"
    hostnames:
        - "weeklyosm.eu"
        - "newsletter.weeklyosm.eu"
        - "aitov.openstreetmap.de"

weeklyosm__acme_certificates:
    - name: hugo
      domains:
          - weeklyosm.eu
          - www.weeklyosm.eu
          - newsletter.weeklyosm.eu
      on_update:
          - systemctl reload nginx
