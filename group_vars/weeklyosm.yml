---
weeklyosm:
  hostname: "weeklyosm.eu"
  hostname_aliases:
    - "www.weeklyosm.eu"
    - "weekly-hugo.openstreetmap.de"
  hostnames:
    - "weeklyosm.eu"
    - "newsletter.weeklyosm.eu"
    - "weekly-hugo.openstreetmap.de"

weeklyosm_hugo__acme_certificates:
  - name: hugo
    domains:
      - weeklyosm.eu
      - www.weeklyosm.eu
      - newsletter.weeklyosm.eu
    on_update:
      - systemctl reload nginx
